[versions]
agp = "8.7.3"
kotlin = "2.0.20"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.03.01"
material = "1.12.0"
androidxTestCore = "1.6.1"
androidxArch-core = "2.2.0"
androidxArch-testing = "2.2.0"
orgRobolectric = "4.12.2"
mockitoKotlin = "5.3.1"
ioMockk = "1.13.12"
androidxNavigationCompose = "2.8.9"
kotlinxSerialization = "1.7.1"
hilt = "2.51.1"
hiltCompose = "1.2.0"
ksp = "2.0.20-1.0.24"
kotlinxCoroutinesTest = "1.8.1"
turbine = "1.1.0"
gson = "2.11.0"
detekt = "1.23.8"
kover = "0.9.1"
retrofit = "2.11.0"
runtimeAndroid = "1.7.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
test-junitKtx = { module = "androidx.test.ext:junit-ktx", version.ref = "junitVersion" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-runtime-android = { group = "androidx.compose.runtime", name = "runtime-android", version.ref = "runtimeAndroid" }

androidx-arch-core-core-common = { module = "androidx.arch.core:core-common", version.ref = "androidxArch-core" }
androidx-arch-core-core-runtime = { module = "androidx.arch.core:core-runtime", version.ref = "androidxArch-core" }

androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigationCompose" }

com-google-dagger-hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
com-google-dagger-hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
com-google-dagger-hilt-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltCompose" }

androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
io-mockk = { module = "io.mockk:mockk", version.ref = "ioMockk" }
androidx-arch-core-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "androidxArch-testing" }
org-robolectric = { module = "org.robolectric:robolectric", version.ref = "orgRobolectric" }
kotlin-mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
org-jetbrains-kotlinx-kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
app-cash-turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
com-google-code-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

com-squareup-retrofit2-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
com-squareup-retrofit2-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
com-google-dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
com-google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

[bundles]
layer-presentation = [
    "androidx-activity-compose",
    "androidx-core-ktx",
    "androidx-lifecycle-runtime-ktx",
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-ui-tooling",
    "androidx-ui-tooling-preview",
    "androidx-material3",
    "material",
    "androidx-navigation-compose",
    "kotlinx-serialization-json",
    "com-google-dagger-hilt-android",
    "com-google-dagger-hilt-compose"
]

layer-domain = [
    "androidx-core-ktx",
    "com-google-dagger-hilt-android",
    "androidx-compose-bom",
    "androidx-runtime-android"
]

layer-data = [
    "androidx-core-ktx",
    "androidx-lifecycle-runtime-ktx",
    "kotlinx-serialization-json",
    "com-google-dagger-hilt-android",
    "com-google-code-gson",
    "com-squareup-retrofit2-retrofit",
    "com-squareup-retrofit2-converter-gson",
]
layer-common-fundaments = [
    "androidx-core-ktx",
    "androidx-lifecycle-runtime-ktx",
    "com-google-dagger-hilt-android",
    "kotlinx-serialization-json",
]

compilers-ksp-generic = [
    "com-google-dagger-hilt-android-compiler",
]

compilers-ksp-data = [
    "com-google-dagger-hilt-android-compiler",
]

testing-instrumentation = [
    "androidx-junit",
    "androidx-espresso-core",
]
testing-unit = [
    "androidx-arch-core-core-common",
    "androidx-arch-core-core-runtime",
    "androidx-arch-core-core-testing",
    "androidx-test-core-ktx",
    "org-robolectric",
    "kotlin-mockito-kotlin",
    "io-mockk",
    "junit",
    "kotlin-test",
    "androidx-junit",
    "test-junitKtx",
    "org-jetbrains-kotlinx-kotlinx-coroutines-test",
    "app-cash-turbine",
]